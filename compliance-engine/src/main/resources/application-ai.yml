spring:
  ai:
    model:
      embedding: ollama
      chat: none

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        enabled: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: NONE
        initialize-schema: true

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./private-uploads}
