spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: compliance-engine

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}