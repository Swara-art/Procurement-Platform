spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: compliance-engine

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  ai:
    model:
      embedding: openai
    openai:
      # Keep OpenAI auto-configuration constructible during normal local startup.
      # AI ingestion endpoints remain disabled unless the `ai` profile is active.
      api-key: ${OPENAI_API_KEY:local-development-key}
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
    vectorstore:
      pgvector:
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        initialize-schema: false

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: WARN
    com.procurement.compliance_engine: DEBUG
    org.springframework.web: WARN

jwt:
  secret: ${JWT_SECRET}

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./private-uploads}
