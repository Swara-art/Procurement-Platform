spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: compliance-engine

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  ai:
    model:
      embedding: openai
    openai:
      # Keep OpenAI auto-configuration constructible during normal local startup.
      # AI ingestion endpoints remain disabled unless the `ai` profile is active.
      api-key: ${OPENAI_API_KEY:local-development-key}
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
    vectorstore:
      pgvector:
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        initialize-schema: false

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: WARN
    com.procurement.compliance_engine: DEBUG
    org.springframework.web: WARN

jwt:
  secret: ${JWT_SECRET}

app:
  classification:
    provider: ${CLASSIFICATION_PROVIDER:rules}
    groq:
      api-key: ${GROQ_API_KEY:}
      endpoint: ${GROQ_API_ENDPOINT:https://api.groq.com/openai/v1}
      model: ${GROQ_CLASSIFICATION_MODEL:llama-3.3-70b-versatile}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    refresh-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-days: ${REFRESH_TOKEN_DAYS:7}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-organization-id: ${BOOTSTRAP_ADMIN_ORGANIZATION_ID:}

  storage:
    provider: ${STORAGE_PROVIDER:local}
    scan-required: ${DOCUMENT_MALWARE_SCAN_REQUIRED:true}
    upload-dir: ${APP_UPLOAD_DIR:./private-uploads}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:26214400}
    s3:
      bucket: ${DOCUMENT_BUCKET:procurement-private}
      region: ${AWS_REGION:ap-south-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      kms-key-id: ${S3_KMS_KEY_ID:}
